<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>人物の相関</title>
<style>
  :root { --bg: #fdfcf8; --sea: #eef3f7; --ink: #222; --dim: #666; --line: #c8d0d8; --panel: #fff; }
  body { margin: 0; font-family: sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 16px 0 0; }
  .layers label { margin-right: 10px; white-space: nowrap; }
  .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 3px; vertical-align: middle; }
  main { display: grid; grid-template-columns: 1fr 380px; height: calc(100vh - 56px); }
  #graph { overflow: auto; }
  svg { display: block; }
  aside { border-left: 1px solid var(--line); overflow: auto; padding: 12px; background: var(--panel); font-size: 13px; }
  aside h2 { font-size: 14px; margin: 0 0 6px; }
  aside h3 { font-size: 13px; margin: 12px 0 4px; color: var(--dim); }
  aside dl { margin: 0 0 12px; display: grid; grid-template-columns: 5em 1fr; gap: 2px 8px; }
  aside dt { color: var(--dim); }
  aside dd { margin: 0; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--sea); }
  .hint { color: var(--dim); }
  .text { white-space: pre-wrap; margin: 4px 0 8px; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; padding: 6px 8px; font-size: 12px; border-radius: 3px; white-space: pre; display: none; max-width: 360px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 40vh; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>人物の相関</h1>
  <div class="layers" id="layers"></div>
  <label class="hint">拡大 <input type="range" id="zoom" min="0.5" max="3" step="0.25" value="1"> <span id="zoomv">1×</span></label>
  <label class="hint" id="yearbox">年 <input type="number" id="year"> <span id="yearv"></span> <label><input type="checkbox" id="allyears" checked>全期間</label></label>
  <button id="reset">並べ直す</button>
</header>
<main>
  <div id="graph"></div>
  <aside id="side"></aside>
</main>
<div class="tip" id="tip"></div>
<script>
const DATA = {"characters": [{"id": 1, "name": "ノア", "kind": "人物", "sex": "両性", "start": 11572, "end": 11722, "path": "ノウル/メインキャラ/1_ノア.md"}, {"id": 2, "name": "ミレア", "kind": "人物", "sex": "女", "start": 11551, "end": null, "path": "ノウル/メインキャラ/2_ミレア.md"}, {"id": 3, "name": "カシル", "kind": "人物", "sex": "男", "start": 11545, "end": 11603, "path": "ノウル/メインキャラ/3_カシル.md"}, {"id": 4, "name": "アウレア", "kind": "人物", "sex": "女", "start": 11480, "end": null, "path": "ノウル/4_アウレア.md"}, {"id": 5, "name": "ピリム", "kind": "人物", "sex": "無し", "start": 11300, "end": null, "path": "ノウル/5_ピリム.md"}, {"id": 6, "name": "セルウィン", "kind": "人物", "sex": "男", "start": 11190, "end": null, "path": "ノウル/6_セルウィン.md"}, {"id": 7, "name": "ラファル", "kind": "人物", "sex": "男", "start": 11572, "end": null, "path": "ノウル/7_ラファル.md"}, {"id": 8, "name": "裁定局", "kind": "組織", "sex": null, "start": 10000, "end": null, "path": "ノウル/組織/8_裁定局.md"}, {"id": 9, "name": "血統管理省", "kind": "組織", "sex": null, "start": 10000, "end": null, "path": "ノウル/組織/9_血統管理省.md"}, {"id": 10, "name": "ユスト", "kind": "人物", "sex": "男", "start": 11542, "end": null, "path": "ノウル/10_ユスト.md"}, {"id": 11, "name": "アルバ", "kind": "人物", "sex": "男", "start": 11608, "end": null, "path": "ノウル/11_アルバ.md"}, {"id": 12, "name": "ヴィガ", "kind": "人物", "sex": "男", "start": 11545, "end": null, "path": "ノウル/サブ/12_ヴィガ.md"}, {"id": 13, "name": "セラ", "kind": "人物", "sex": "女", "start": 11556, "end": null, "path": "ノウル/サブ/13_セラ.md"}, {"id": 14, "name": "ドラン", "kind": "人物", "sex": "男", "start": 11550, "end": null, "path": "ノウル/サブ/14_ドラン.md"}, {"id": 15, "name": "フィノ", "kind": "人物", "sex": "男", "start": 11558, "end": null, "path": "ノウル/サブ/15_フィノ.md"}, {"id": 16, "name": "エルミナ", "kind": "人物", "sex": "女", "start": 11554, "end": null, "path": "ノウル/サブ/16_エルミナ.md"}, {"id": 17, "name": "コル", "kind": "人物", "sex": "男", "start": 11548, "end": null, "path": "ノウル/サブ/17_コル.md"}, {"id": 18, "name": "イアレス", "kind": "人物", "sex": "女", "start": 11557, "end": null, "path": "ノウル/サブ/18_イアレス.md"}, {"id": 19, "name": "オルシナ", "kind": "人物", "sex": "女", "start": 11565, "end": null, "path": "ノウル/サブ/19_オルシナ.md"}, {"id": 20, "name": "ヴェリオ", "kind": "人物", "sex": "男", "start": 11550, "end": null, "path": "ノウル/サブ/20_ヴェリオ.md"}, {"id": 21, "name": "ガレナ", "kind": "人物", "sex": "女", "start": 11577, "end": null, "path": "ノウル/メインキャラ/21_ガレナ.md"}, {"id": 22, "name": "ラウロ", "kind": "人物", "sex": "男", "start": 11574, "end": 11663, "path": "ノウル/メインキャラ/チームエンジェルウィング/22_ラウロ.md"}, {"id": 23, "name": "イルウェン", "kind": "人物", "sex": "女", "start": 11567, "end": null, "path": "ノウル/メインキャラ/チームエンジェルウィング/23_イルウェン.md"}, {"id": 24, "name": "ブラン", "kind": "人物", "sex": "男", "start": 11552, "end": null, "path": "ノウル/メインキャラ/チームエンジェルウィング/24_ブラン.md"}], "relations": [{"id": 1, "character_id_1": 2, "character_id_2": 1, "relation": "母(同居)", "start": 11572, "end": 11593, "text": "出生の日に娘の遺伝子構成が登録規格に無いと知る。裁定局の廃棄処分に抗議して止め、監視役の妖精つきで四年を都で親子として暮らす。1576年、娘への遺伝凍結処理の決定に反対し、娘を連れて地上へ逃げ、ローザ諸都市同盟で新しい暮らしを始める。地上では人間族の子として育て、父のことも白い灯りの意味も語らない。"}, {"id": 2, "character_id_1": 2, "character_id_2": 1, "relation": "同行(旅に加わる)", "start": 11593, "end": null, "text": "娘から覆面の悪魔と出会った話を聞き、その危うさに悲壮な決意をして、以後は娘の旅に同行する。1603年、パンデムで死にゆくカシルの隣に立ち会う。"}, {"id": 3, "character_id_1": 1, "character_id_2": 2, "relation": "娘", "start": 11572, "end": null, "text": "四歳までは都で、四歳からは地上で母と二人で暮らす。母が自分を廃棄処分から守り、凍結処理から逃がしたことは知らずに、人間族の子として育つ。1582年に母だけが昇り、地上に残される。"}, {"id": 4, "character_id_1": 3, "character_id_2": 1, "relation": "父(名乗らぬ)", "start": 11572, "end": 11582, "text": "娘の遺伝子を「原初型」で設計し、各種デバイスの拡張インターフェースを備えた体を作った。娘の出生の日に違法遺伝子調整の容疑で逮捕され、以後は娘と暮らさない。1576年、原初型の持ち出しと使用を理由に追放処分を受けて地下ネザルへ降りる。妻と娘は同じ年に地上へ逃げる。"}, {"id": 5, "character_id_1": 3, "character_id_2": 1, "relation": "敵(悪魔として)", "start": 11582, "end": 11603, "text": "パンデムの悪魔として地上に「開放型」を配る。1593年、旅する娘と初めて出会うが、互いに名乗らないまま去る。以後、ザハラ全土を巻き込む紛争でパンデム王の腹心として深く関わる。1603年、型を追って地下まで来た娘と対峙し、致命傷を負わされる。死の間際、初めて父と名乗り、自らの理想とやり残したことを語り、遺志を託して果てる。"}, {"id": 6, "character_id_1": 1, "character_id_2": 3, "relation": "父を知らぬ", "start": 11572, "end": 11603, "text": "父を覚えずに育つ。1593年、旅の中で開放型を配る覆面の悪魔と初めて出会うが、父だとは知らない。型を負わされて追われる者たちの側に立ち、型の出所を辿った先に居るのが父だとは知らないまま、1603年の対峙を迎える。"}, {"id": 7, "character_id_1": 1, "character_id_2": 3, "relation": "敵(父と知って拒む)", "start": 11603, "end": null, "text": "1603年、地下パンデムで対峙し、死に際に自分の体を設計したのもこの悪魔・実の父だと告げられる。父と知って拒み、刃を交えて敗る。父が地上に散らした型の持ち主たちと、託された遺志を遺される。"}, {"id": 8, "character_id_1": 3, "character_id_2": 2, "relation": "夫", "start": 11570, "end": 11576, "text": "幼い頃からの友人で、恋愛関係を経て1570年に派遣官の家系のミレアと結ばれ、家に入る。1572年、娘の出生の日に逮捕されてからは会えず、1576年に追放処分を受けてからは妻と娘のことを口にしなくなる。"}, {"id": 9, "character_id_1": 2, "character_id_2": 3, "relation": "妻(庇う)", "start": 11570, "end": 11576, "text": "幼い頃からの友人で恋人。夫が娘の遺伝子を設計したと知って庇う。1572年に夫が逮捕され、1576年に追放処分と娘への凍結処理が決まると、これに反対して娘を連れて地上へ逃げる。"}, {"id": 10, "character_id_1": 4, "character_id_2": 2, "relation": "母・家長", "start": 11551, "end": null, "text": "派遣官の家系の家長で裁定官。娘とカシルの縁を技能を買って認めた。孫の廃棄を裁定したが娘の抗議で撤回する。1576年、娘が凍結処理に反対して孫を連れて逃げるのを止めず、裁定局には隠したまま、妖精ピリムから家族の様子を聞き続ける。"}, {"id": 11, "character_id_1": 2, "character_id_2": 4, "relation": "娘", "start": 11551, "end": null, "text": "裁定官の母が下した孫の廃棄処分に抗議して撤回させる。母から孫の外部デバイス早期接続を求められるが従わず、1576年には凍結処理に反対して孫を連れて逃げる。召還されたあと、母から孫へ渡す灯し方の一枚を預かる。"}, {"id": 12, "character_id_1": 4, "character_id_2": 1, "relation": "祖母(廃棄を裁定した)", "start": 11572, "end": 11582, "text": "出生の日、裁定官として規格外の孫を廃棄処分と裁定したが、娘の抗議で中止した。以後四年、家系記録の瑕疵と見ながらも祖母として一定の交流を持つ。1576年、孫への凍結処理の決定を局として下す側に立ち、娘が孫を連れて逃げたあとは、妖精ピリムから秘密裏に様子を聞いている。"}, {"id": 13, "character_id_1": 4, "character_id_2": 1, "relation": "祖母(灯し方を遺す)", "start": 11576, "end": null, "text": "娘の抗議で孫の廃棄処分を撤回した後も、規格外の孫を胸の内では気にかけ続ける。1576年、娘が孫を連れて地上へ逃げる際、離反した妖精ピリムに託して、孫へ渡すよう自分の灯りの灯し方を書いた一枚を持たせる。"}, {"id": 14, "character_id_1": 4, "character_id_2": 3, "relation": "娘婿(縁を切る)", "start": 11570, "end": 11582, "text": "序列の下の出だが技能が家の役に立つとして、娘との縁を1570年に認めた。1572年に逮捕され、1576年に追放処分を受けた年に、家を守るために縁を切る。"}, {"id": 15, "character_id_1": 8, "character_id_2": 2, "relation": "派遣官の任務を負わせる(離反)", "start": 11569, "end": 11576, "text": "11569年から二度、地上への派遣官として裁定通達を伝えさせた。11572年、娘の廃棄処分に抗議されて撤回する。11576年、娘への遺伝凍結処理に反対して娘を連れ地上へ逃げたため、派遣官の任を解き、逃亡者として扱う。"}, {"id": 16, "character_id_1": 8, "character_id_2": 1, "relation": "台帳に入らぬ子", "start": 11572, "end": 11582, "text": "届け出られた子を台帳のどこにも登録できず初めて意見が割れる。裁定官アウレアが廃棄処分を裁定するが母の抗議で中止し、規格外として保留登録し、監視役の妖精をつける。1576年、父の追放処分に際して後々の遺伝バランスを崩すリスクがあると判明し、遺伝凍結処理を決定するが、母子の逃亡で実施できない。地上から上がる「天の子」の噂を、加護と取る派と瑕疵と取る派で対立する。"}, {"id": 17, "character_id_1": 8, "character_id_2": 1, "relation": "接続不認可の決定", "start": 11582, "end": null, "text": "1582年、十歳の接続審査で外部デバイスを接続しないと決定し、子を地上の台帳の外に置く。不認可の前例が局の中に亀裂として残る。"}, {"id": 18, "character_id_1": 8, "character_id_2": 3, "relation": "追放処分", "start": 11572, "end": null, "text": "娘の出生の日に血統管理省が違法遺伝子調整の容疑で逮捕し、原初型の複製が見つかったのを受けて、1576年に原初型の持ち出しと使用を理由に追放処分を決め、地下ネザルへ降ろす。以後、地下から「開放型」を配る悪魔として裁定の相手になる。"}, {"id": 19, "character_id_1": 8, "character_id_2": 6, "relation": "記録の封鎖を求める", "start": 11572, "end": 11582, "text": "子を巡る都の記録を消すため、リンドールの塔に子に関わる記録をすべて封鎖するよう求める。"}, {"id": 20, "character_id_1": 8, "character_id_2": 5, "relation": "連絡員(離反)", "start": 11310, "end": 11576, "text": "通達を地上まで運ぶ連絡員として二百年余り使う。11572年、白い灯りの子の監視役につける。11576年、母子の逃亡に同調して離反し、局から離れる。体が無いので追い払えない。"}, {"id": 21, "character_id_1": 5, "character_id_2": 1, "relation": "見張り(同行)", "start": 11572, "end": 11582, "text": "監視役として子の側で見聞きしたことを毎月裁定局へ報告するが、子を面白がるうちに肩入れする。1576年、母が子を連れて逃げるのに同調して裁定局から離反し、地上まで同行する。地上でも子と遊び、悪魔の遺物に触れて倒れかけた子を風の姿で運び出す。"}, {"id": 22, "character_id_1": 5, "character_id_2": 1, "relation": "影に住みつく", "start": 11582, "end": null, "text": "裁定局を離反したまま、母が昇ったあとも子の影に住みついて離れない。"}, {"id": 23, "character_id_1": 7, "character_id_2": 5, "relation": "報告書を盗み聞く", "start": 11572, "end": 11582, "text": "監視役の妖精が都へ運ぶ報告書を盗み聞きし、地上の子の話を自分の灯り比べより面白いと思う。"}, {"id": 24, "character_id_1": 9, "character_id_2": 8, "relation": "裁定局の下に置かれる", "start": 1, "end": null, "text": "新典歴0年に裁定局の下に発足し、登録規格を守ることで序列を守る役を負う。カシルの複製が見つかったとき、自ら裁定局に報告して省の規程の潔白を示す。"}, {"id": 25, "character_id_1": 9, "character_id_2": 3, "relation": "省の調整官", "start": 11563, "end": 11582, "text": "序列の下の出として初めて技能で採用した。担当した子が出生時の検査で規格外と分かり、違法遺伝子調整の容疑で逮捕して省の内部で取り調べる。1576年、手元からリンドールの複製が見つかり、追放処分と合わせて免職する。"}, {"id": 26, "character_id_1": 9, "character_id_2": 3, "relation": "免職した者", "start": 11582, "end": null, "text": "規格外の遺伝子を二度と設計させないよう規程を厳しくする。だが白い灯りの型を覚えている調整官が省の中に一人残る。"}, {"id": 27, "character_id_1": 6, "character_id_2": 3, "relation": "記録データの貸借", "start": 11568, "end": 11582, "text": "エンピレオとの記録データの貸借で文書だけの付き合い。11572年、閲覧禁止区画の「原初型」が一件消えていると気づき、白い灯りの子と結びつけて文書で問いただすが、はぐらかされる。"}, {"id": 28, "character_id_1": 3, "character_id_2": 6, "relation": "複製を返さぬ", "start": 11568, "end": null, "text": "塔から借りた「原初型」の複製を返却せずに手元に留め、娘の遺伝子を設計する。追放されるときに地下へ持ち去る。"}, {"id": 29, "character_id_1": 6, "character_id_2": 1, "relation": "記録に無い者", "start": 11582, "end": null, "text": "裁定局に求められて子に関わる記録を封鎖するが、生まれた年を五桁で記した一枚だけを区画の外に残す。いつか塔に来ると信じている。"}, {"id": 30, "character_id_1": 7, "character_id_2": 1, "relation": "同じ年の子(噂で知る)", "start": 11572, "end": 11582, "text": "序列一位の家系の跡取り。同じ年に生まれた規格外の白い灯りの子の噂を、顔を合わせる前から都で聞いて育つ。子は四歳で母に連れられて地上へ逃げる。"}, {"id": 31, "character_id_1": 7, "character_id_2": 1, "relation": "翼を得た側", "start": 11582, "end": null, "text": "十歳の接続審査で翼型の外部デバイスを接続され、同じ日にあの子は接続不認可と決まったと知る。家は名を口にすることを禁じるが、雲の縁まで飛べる自分だけが見に行けると思い、地上に降りる口実を探す。"}, {"id": 32, "character_id_1": 4, "character_id_2": 5, "relation": "秘密裏の聞き役", "start": 11576, "end": null, "text": "娘と孫が地上へ逃げたあと、離反した妖精から秘密裏に家族の様子を聞く。裁定局には隠している。"}, {"id": 33, "character_id_1": 5, "character_id_2": 4, "relation": "家族の様子を伝える", "start": 11576, "end": null, "text": "裁定局から離反したあとも、アウレアにだけ母子の暮らしを伝える。恩は必ず返す性分で、祖母の隠した心配に応えている。"}, {"id": 34, "character_id_1": 8, "character_id_2": 4, "relation": "裁定官", "start": 11512, "end": null, "text": "派遣官の家系の家長として裁定官の席を持つ。1572年、規格外の孫の廃棄処分を裁定し、娘の抗議で撤回する。1576年以後、妖精から家族の様子を聞いていることを局に隠している。"}, {"id": 35, "character_id_1": 10, "character_id_2": 3, "relation": "妬む同僚(告発)", "start": 11563, "end": null, "text": "序列一位の家柄で調整官に就いた身を、序列十二位から技能で上がってきたカシルに数年で追い抜かれ、妬む。理念を守るためと自分に言い聞かせながら記録データの出所を探り、1572年に出生時検査で規格外を見つけると、ただちに届け出て逮捕を主導する。1576年の追放処分でも原初型の持ち出しを証拠として突きつける側に立つ。"}, {"id": 36, "character_id_1": 3, "character_id_2": 10, "relation": "告発した同僚", "start": 11563, "end": null, "text": "家柄だけの調整官と見下し、相手の妬みには気づかずにいた。娘の出生時検査を担当したのがこの男だったと、逮捕されてから知る。"}, {"id": 37, "character_id_1": 10, "character_id_2": 7, "relation": "父(跡取りに翼を約束)", "start": 11572, "end": null, "text": "規格どおりに設計して生まれさせた跡取り。十歳の接続審査で最初に翼を接続させると約束し、家の期待を一身に負わせる。白い灯りの子の名を家で口にすることを禁じ、自分が告発した相手の娘だとは教えない。"}, {"id": 38, "character_id_1": 7, "character_id_2": 10, "relation": "父(期待に応える)", "start": 11572, "end": null, "text": "父の語る「都の理念」をそのまま信じて育ち、最初の翼を得て父の期待に応えようとする。父が白い灯りの子の父を告発したことは知らない。"}, {"id": 39, "character_id_1": 9, "character_id_2": 10, "relation": "省の調整官(家柄)", "start": 11560, "end": null, "text": "序列一位の家柄で調整官に就けた。1572年、担当した出生時検査で規格外を見つけて裁定局へ届け出た功で、省の潔白を示した者として評価を上げる。"}, {"id": 40, "character_id_1": 10, "character_id_2": 1, "relation": "規格外と届け出た", "start": 11572, "end": null, "text": "出生時検査を担当し、遺伝子構成が登録規格に無いことを見つけて裁定局へ届け出る。白い灯りの子を、自分の正しさを脅かす存在として見る。"}, {"id": 41, "character_id_1": 2, "character_id_2": 3, "relation": "死を看取る", "start": 11603, "end": null, "text": "1603年、パンデムで致命傷を負ったカシルの隣に立ち会い、涙ながらに思いを口にする。その後、ノアと共にパンデムを後にする。"}, {"id": 42, "character_id_1": 1, "character_id_2": 11, "relation": "母", "start": 11608, "end": null, "text": "祖父カシルの遺志を語り聞かせながら育てる。旅を続けるノアの傍らで育ち、やがて自分の道を選ぶ。"}, {"id": 43, "character_id_1": 11, "character_id_2": 1, "relation": "息子", "start": 11608, "end": null, "text": "母から祖父の理想を託されて育つが、その重さにやがて向き合うことになる。"}, {"id": 44, "character_id_1": 1, "character_id_2": 22, "relation": "戦友", "start": 11582, "end": null, "text": "ヴァレンツァで一緒に育った二歳下の幼馴染。11588年に一党へ迎え、以後は死ぬまで隣に立つ相手になる。人間の彼が自分に追いつけないことを、ノアは長く自分の罪のように感じる。"}, {"id": 45, "character_id_1": 22, "character_id_2": 1, "relation": "戦友", "start": 11582, "end": null, "text": "二歳上の幼馴染で、一党の主。どれだけ剣を振ってもノアの身体能力には届かないと早くから分かっていて、それでも隣に立ち続けることを選ぶ。"}, {"id": 46, "character_id_1": 1, "character_id_2": 23, "relation": "戦友", "start": 11586, "end": null, "text": "十四歳のとき、外見が同じくらいの子どもに見えるエルフとして出会う。怠惰さに何度も振り回されるが、手放したことは一度もない。最期を看取られる相手。"}, {"id": 47, "character_id_1": 23, "character_id_2": 1, "relation": "戦友", "start": 11586, "end": null, "text": "里を出てすぐ拾われるように一党へ入り、百年以上を共に過ごす。老いないノアが老いていくのを、さらに老いない側から見続ける。"}, {"id": 48, "character_id_1": 1, "character_id_2": 24, "relation": "弟子", "start": 11586, "end": null, "text": "冒険者の仕事を一通り仕込まれた最初の先輩。無力感に沈んだ十代後半から二十代の荒れた時期を、引き戻そうとせずに付き合ってくれた相手。"}, {"id": 49, "character_id_1": 24, "character_id_2": 1, "relation": "師", "start": 11586, "end": null, "text": "十四歳で組んだ、規格外に身体能力の高い子ども。教えることはすぐ無くなったが、腐っていく時期を見放さなかった。"}, {"id": 50, "character_id_1": 22, "character_id_2": 23, "relation": "戦友", "start": 11588, "end": null, "text": "一党の前衛と後衛。八十九年の生涯をほぼ共に戦い、最期は彼女に看取られる。"}, {"id": 51, "character_id_1": 23, "character_id_2": 22, "relation": "戦友", "start": 11588, "end": null, "text": "一党で最も長く並んだ相手。11663年、老いた彼を看取る。"}, {"id": 52, "character_id_1": 21, "character_id_2": 22, "relation": "幼馴染", "start": 11584, "end": null, "text": "同じ街で育った三歳上の幼馴染。ノアを間に挟んだ悪友どうしで、のちに同じ一党の前衛として並ぶ。"}, {"id": 53, "character_id_1": 22, "character_id_2": 21, "relation": "幼馴染", "start": 11584, "end": null, "text": "三歳下の幼馴染。ノアに突っかかってきた子どもの頃から知っている。"}]};
const COLORS = ["#c0392b", "#2471a3", "#1e8449", "#b9770e", "#7d3c98", "#148f77", "#a04000", "#5d6d7e", "#d4ac0d", "#884ea0"];
const R_NODE = 18, BASE = 720;
const state = { hidden: new Set(), selected: null, zoom: 1, pos: new Map(), drag: null, year: null };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = new Map(DATA.characters.map(c => [c.id, c]));
const nameOf = id => byId.get(id)?.name ?? `id=${id}`;
const kinds = [...new Set(DATA.characters.map(c => c.kind ?? ""))];
const colorOf = Object.fromEntries(kinds.map((k, i) => [k, COLORS[i % COLORS.length]]));
const inYear = (o, y) => y == null || ((o.start == null || o.start <= y) && (o.end == null || o.end > y));
const shownCharacters = () => DATA.characters.filter(c => !state.hidden.has(c.kind ?? "") && inYear(c, state.year));
const shownRelations = () => { const ids = new Set(shownCharacters().map(c => c.id));
  return DATA.relations.filter(r => ids.has(r.character_id_1) && ids.has(r.character_id_2) && inYear(r, state.year)); };
const spanText = o => (o.start == null && o.end == null) ? "" : `${o.start ?? ""}〜${o.end ?? ""}`;
const YEARS = [...DATA.relations, ...DATA.characters].flatMap(o => [o.start, o.end]).filter(y => y != null);
const YEAR_MIN = YEARS.length ? Math.min(...YEARS) : 0, YEAR_MAX = YEARS.length ? Math.max(...YEARS) : 0;
const firstLine = t => (t ?? "").split("\n").find(l => l.trim()) ?? "";

function layout() {
  // 円に並べてから、繋がりのある同士を寄せ、無い同士を離す簡単な力学配置。
  const nodes = DATA.characters, n = nodes.length, cx = BASE / 2, cy = BASE / 2, r = BASE / 2 - 80;
  const pos = new Map(nodes.map((c, i) => [c.id, { x: cx + r * Math.cos(2 * Math.PI * i / n - Math.PI / 2), y: cy + r * Math.sin(2 * Math.PI * i / n - Math.PI / 2) }]));
  const linked = new Set(DATA.relations.map(e => `${e.character_id_1}:${e.character_id_2}`));
  const isLinked = (a, b) => linked.has(`${a}:${b}`) || linked.has(`${b}:${a}`);
  for (let step = 0; step < 300; step++) {
    const force = new Map(nodes.map(c => [c.id, { x: 0, y: 0 }]));
    for (const a of nodes) for (const b of nodes) {
      if (a.id >= b.id) continue;
      const pa = pos.get(a.id), pb = pos.get(b.id);
      const dx = pb.x - pa.x, dy = pb.y - pa.y, d = Math.max(1, Math.hypot(dx, dy));
      let f = 20000 / (d * d);
      if (isLinked(a.id, b.id)) f -= (d - 160) * 0.05;
      force.get(a.id).x -= f * dx / d; force.get(a.id).y -= f * dy / d;
      force.get(b.id).x += f * dx / d; force.get(b.id).y += f * dy / d;
    }
    for (const c of nodes) {
      const p = pos.get(c.id), f = force.get(c.id);
      p.x += (cx - p.x) * 0.01 + Math.max(-8, Math.min(8, f.x));
      p.y += (cy - p.y) * 0.01 + Math.max(-8, Math.min(8, f.y));
      p.x = Math.min(BASE - 60, Math.max(60, p.x)); p.y = Math.min(BASE - 60, Math.max(60, p.y));
    }
  }
  state.pos = pos;
}

function renderLayers() {
  const box = document.getElementById("layers");
  box.innerHTML = kinds.map(k =>
    `<label><input type="checkbox" data-kind="${esc(k)}" ${state.hidden.has(k) ? "" : "checked"}>` +
    `<span class="swatch" style="background:${colorOf[k]}"></span>${esc(k || "(種別なし)")}</label>`).join("");
  box.onchange = e => { const k = e.target.dataset.kind; if (e.target.checked) state.hidden.delete(k); else state.hidden.add(k); render(); };
}

function edgePath(a, b, bend) {
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.max(1, Math.hypot(dx, dy));
  const nx = -dy / d, ny = dx / d;
  const mx = (a.x + b.x) / 2 + nx * bend, my = (a.y + b.y) / 2 + ny * bend;
  const ex = b.x - dx / d * (R_NODE + 4) + (mx - b.x) * 0.0, ey = b.y - dy / d * (R_NODE + 4);
  return { d: `M${a.x},${a.y} Q${mx},${my} ${ex},${ey}`, lx: (a.x + 2 * mx + b.x) / 4, ly: (a.y + 2 * my + b.y) / 4 };
}

function renderGraph() {
  const z = state.zoom, W = BASE * z, H = BASE * z;
  const chars = shownCharacters(), rels = shownRelations();
  const sel = state.selected;
  const related = new Set();
  if (sel?.type === "character") for (const r of rels) if (r.character_id_1 === sel.id || r.character_id_2 === sel.id) related.add(r.id);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" font-size="${11 * z}">`;
  s += `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>` +
       `<marker id="arrow-on" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>`;
  s += `<rect width="${W}" height="${H}" fill="#fdfcf8"/>`;
  const pairCount = new Map();
  for (const r of rels) { const k = [r.character_id_1, r.character_id_2].sort((a, b) => a - b).join(":"); pairCount.set(k, (pairCount.get(k) ?? 0) + 1); }
  const seen = new Map();
  for (const r of rels) {
    const a = state.pos.get(r.character_id_1), b = state.pos.get(r.character_id_2);
    if (!a || !b) continue;
    const k = [r.character_id_1, r.character_id_2].sort((x, y) => x - y).join(":");
    const i = seen.get(k) ?? 0; seen.set(k, i + 1);
    const total = pairCount.get(k), bend = (i - (total - 1) / 2) * 40 * (r.character_id_1 < r.character_id_2 ? 1 : -1);
    const sa = { x: a.x * z, y: a.y * z }, sb = { x: b.x * z, y: b.y * z };
    const e = edgePath(sa, sb, bend * z);
    const on = sel?.type === "relation" ? sel.id === r.id : related.has(r.id);
    const dim = sel && !on;
    s += `<g class="edge" data-id="${r.id}" style="cursor:pointer" opacity="${dim ? 0.25 : 1}">`;
    s += `<path d="${e.d}" fill="none" stroke="transparent" stroke-width="12"/>`;
    s += `<path d="${e.d}" fill="none" stroke="${on ? "#c0392b" : "#555"}" stroke-width="${on ? 2.2 : 1.2}" marker-end="url(#${on ? "arrow-on" : "arrow"})"/>`;
    s += `<text x="${e.lx}" y="${e.ly}" text-anchor="middle" fill="${on ? "#c0392b" : "#333"}" stroke="#fdfcf8" stroke-width="3" paint-order="stroke" font-weight="${on ? "bold" : "normal"}">${esc(r.relation)}</text></g>`;
  }
  for (const c of chars) {
    const p = state.pos.get(c.id); if (!p) continue;
    const on = sel?.type === "character" && sel.id === c.id;
    const touched = sel?.type === "relation" && (sel.character_id_1 === c.id || sel.character_id_2 === c.id);
    s += `<g class="node" data-id="${c.id}" style="cursor:pointer">`;
    s += `<circle cx="${p.x * z}" cy="${p.y * z}" r="${R_NODE * z}" fill="${colorOf[c.kind ?? ""]}" stroke="${on || touched ? "#222" : "#fff"}" stroke-width="${on || touched ? 3 : 1.5}"/>`;
    s += `<text x="${p.x * z}" y="${(p.y + R_NODE + 14) * z}" text-anchor="middle" fill="#222" stroke="#fdfcf8" stroke-width="3" paint-order="stroke" font-size="${12 * z}" font-weight="${on ? "bold" : "normal"}">${esc(c.name)}</text></g>`;
  }
  s += "</svg>";
  const graph = document.getElementById("graph");
  graph.innerHTML = s;
  const tip = document.getElementById("tip");
  const showTip = (e, lines) => { tip.style.display = "block"; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px"; tip.textContent = lines.filter(Boolean).join("\n"); };
  graph.querySelectorAll(".node").forEach(g => {
    const c = byId.get(+g.dataset.id);
    g.onmousedown = e => { state.drag = { id: c.id, x: e.clientX, y: e.clientY, moved: false }; e.preventDefault(); };
    g.onmousemove = e => showTip(e, [`${c.name} (${c.kind ?? ""})`, c.sex ? `性別: ${c.sex}` : null,
      spanText(c) ? `期間: ${spanText(c)}` : null, `記事: ${c.path}`]);
    g.onmouseleave = () => { tip.style.display = "none"; };
  });
  graph.querySelectorAll(".edge").forEach(g => {
    const r = DATA.relations.find(q => q.id === +g.dataset.id);
    g.onclick = () => { state.selected = sel?.type === "relation" && sel.id === r.id ? null : { type: "relation", ...r }; render(); };
    g.onmousemove = e => showTip(e, [`${nameOf(r.character_id_1)} → ${nameOf(r.character_id_2)}: ${r.relation}`, spanText(r) ? `期間: ${spanText(r)}` : null, firstLine(r.text)]);
    g.onmouseleave = () => { tip.style.display = "none"; };
  });
}

document.addEventListener("mousemove", e => {
  const d = state.drag; if (!d) return;
  const p = state.pos.get(d.id);
  p.x += (e.clientX - d.x) / state.zoom; p.y += (e.clientY - d.y) / state.zoom; d.x = e.clientX; d.y = e.clientY; d.moved = true;
  renderGraph();
});
document.addEventListener("mouseup", () => {
  const d = state.drag; if (!d) return; state.drag = null;
  if (!d.moved) { state.selected = state.selected?.type === "character" && state.selected.id === d.id ? null : { type: "character", id: d.id }; }
  render();
});

function relationRow(r, from) {
  const other = from == null ? null : (r.character_id_1 === from ? r.character_id_2 : r.character_id_1);
  return `<tr class="row" data-id="${r.id}">` +
    (from == null ? `<td>${esc(nameOf(r.character_id_1))}</td><td>${esc(r.relation)} →</td><td>${esc(nameOf(r.character_id_2))}</td>`
                  : `<td>${r.character_id_1 === from ? "→" : "←"}</td><td>${esc(nameOf(other))}</td><td>${esc(r.relation)}</td>`) +
    `<td class="hint">${esc(spanText(r))}</td><td class="hint">${esc(firstLine(r.text))}</td></tr>`;
}

function renderSide() {
  const side = document.getElementById("side"), sel = state.selected, rels = shownRelations();
  const table = (rows, head) => `<table><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr>${rows.join("")}</table>`;
  if (!sel) {
    side.innerHTML = `<p class="hint">人物をクリックするとその人物の関係を、矢印をクリックするとその関係の本文を出す。人物はドラッグで動かせる。</p>` +
      `<p class="hint">人物 ${shownCharacters().length} 件、関係 ${rels.length} 件${state.year == null ? "" : `(${state.year} 年に続いているもの)`}。矢印は character_id_1 → character_id_2 の向き。</p>` +
      (rels.length ? table(rels.map(r => relationRow(r, null)), ["主体", "関係", "相手", "期間", ""]) : "");
  } else if (sel.type === "character") {
    const c = byId.get(sel.id), mine = rels.filter(r => r.character_id_1 === sel.id || r.character_id_2 === sel.id);
    side.innerHTML = `<h2>${esc(c.name)} <span class="hint">(${esc(c.kind ?? "")})</span></h2>` +
      `<dl>` + (c.sex ? `<dt>性別</dt><dd>${esc(c.sex)}</dd>` : "") +
      (spanText(c) ? `<dt>期間</dt><dd>${esc(spanText(c))}</dd>` : "") +
      `<dt>記事</dt><dd>../character/${esc(c.path)}</dd></dl>` +
      (mine.length ? table(mine.map(r => relationRow(r, sel.id)), ["", "相手", "関係", "期間", ""]) : `<p class="hint">関係は無い。</p>`);
  } else {
    side.innerHTML = `<h2>${esc(nameOf(sel.character_id_1))} → ${esc(nameOf(sel.character_id_2))}</h2>` +
      `<dl><dt>関係</dt><dd>${esc(sel.relation)}</dd>` + (spanText(sel) ? `<dt>期間</dt><dd>${esc(spanText(sel))}</dd>` : "") + `<dt>id</dt><dd>${sel.id}</dd></dl>` +
      `<div class="text">${esc(sel.text) || '<span class="hint">本文は無い。</span>'}</div>`;
  }
  side.querySelectorAll("tr.row").forEach(tr => { tr.onclick = () => { state.selected = { type: "relation", ...DATA.relations.find(r => r.id === +tr.dataset.id) }; render(); }; });
}

function render() { renderLayers(); renderGraph(); renderSide(); }
document.getElementById("zoom").oninput = e => { state.zoom = +e.target.value; document.getElementById("zoomv").textContent = state.zoom + "×"; render(); };
document.getElementById("reset").onclick = () => { layout(); render(); };
const yearInput = document.getElementById("year"), allYears = document.getElementById("allyears");
yearInput.min = YEAR_MIN; yearInput.max = YEAR_MAX; yearInput.value = YEAR_MIN;
const syncYear = () => { state.year = allYears.checked ? null : +yearInput.value;
  document.getElementById("yearv").textContent = allYears.checked ? "" : `${state.year} 年`; render(); };
yearInput.oninput = () => { allYears.checked = false; syncYear(); };
allYears.onchange = syncYear;
if (!YEARS.length) document.getElementById("yearbox").style.display = "none";
if (DATA.characters.length) { layout(); render(); } else document.getElementById("graph").innerHTML = '<p class="hint" style="padding:16px">人物が居ない。</p>';
</script>
</body>
</html>
